org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Default HTTP timeouts are 30s, which is not enough to pull the Flutter engine
# artifacts over a slow link — they time out mid-download.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.http.keepAlive=true
#org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.enableJetifier=true

# إعدادات Gradle للأداء
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.workers.max=4
kotlin.incremental=false

# حل مشاكل R.txt و processDebugResources (إعدادات صحيحة لـ AGP 8.6.0)
android.nonTransitiveRClass=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
