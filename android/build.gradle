buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // The bundled integration_test plugin declares androidx.test with dynamic
    // versions ("1.2+", "3.3+"). Resolving those forces Gradle to fetch
    // maven-metadata.xml on every build, which fails on an unreliable link.
    // Pinning them removes the metadata lookup entirely.
    configurations.all {
        resolutionStrategy {
            force 'androidx.test:runner:1.3.0'
            force 'androidx.test:rules:1.2.0'
            force 'androidx.test.espresso:espresso-core:3.3.0'

            cacheDynamicVersionsFor 30, 'days'
            cacheChangingModulesFor 30, 'days'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
            }
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
